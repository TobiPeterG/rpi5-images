[Output]
Format=disk
RepartDirectories=%D/mkosi.repart
CompressOutput=no
ManifestFormat=json
SplitArtifacts=uki,partitions,roothash

[Validation]
SecureBootAutoEnroll=no
Verity=defer
Checksum=yes

[Content]
ExtraTrees=%D/mkosi.extra
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageProfiles=%D/mkosi.uki-profiles/recovery.conf
Ssh=yes
SELinuxRelabel=yes
FinalizeScripts=
    %D/mkosi.finalize.chroot
    %D/mkosi.finalize
PostOutputScripts=%D/mkosi.postoutput
KernelCommandLine=
    root=gpt-auto
    rootfstype=erofs
    ro
    rd.shell=0
    rd.emergency=reboot
    systemd.volatile=overlay
    quiet
    loglevel=3
    systemd.show_status=auto
    console=tty0
    console=ttyAMA10,115200n8
    earlycon=pl011,0x107d001000,115200n8
    security=selinux
    selinux=1
    enforcing=0
    systemd.mount-extra=/dev/disk/by-label/STATE:/.state:btrfs:rw,nodev,nosuid,x-systemd.growfs
    systemd.mount-extra=/.state/home:/home:none:bind,rw,nodev,nosuid,noexec
CleanPackageMetadata=yes
WithDocs=no
WithRecommends=no
KernelModulesInitrd=yes
KernelInitrdModules=
    bcm2835-dma
    dm-verity
    erofs
    mmc_block
    overlay
    pcie-brcmstb
    pinctrl-brcmstb-bcm2712
    gpio-brcmstb
    fixed
    gpio-regulator
    sdhci-brcmstb
    sdhci-iproc
Packages=
    aaa_base
    avahi
    avahi-utils
    bash
    bcm43xx-firmware
    btrfsprogs
    ca-certificates
    ca-certificates-mozilla
    coreutils
    cryptsetup
    device-mapper
    dosfstools
    erofs-utils
    glibc-locale
    gpg2
    jeos-firstboot
    kernel-default
    kernel-firmware-all
    less
    MicroOS-release
    mtools
    NetworkManager
    openssh
    openssl
    patterns-base-hardware
    patterns-microos-basesystem
    patterns-microos-defaults
    patterns-microos-selinux
    python3-base
    raspberrypi-firmware
    raspberrypi-firmware-config
    raspberrypi-firmware-dt
    systemd
    systemd-boot
    systemd-container
    systemd-experimental
    timezone
    u-boot-rpiarm64
    udev
    util-linux
    wireless-regdb
    wireless-tools
    wpa_supplicant
    NetworkManager-lang
    avahi-lang
    bash-lang
    coreutils-lang
    cryptsetup-lang
    dialog-lang
    findutils-lang
    glib2-lang
    gpg2-lang
    grep-lang
    policycoreutils-lang
    sed-lang
    systemd-lang
    tar-lang
    util-linux-lang

RemovePackages=
    kdump
    read-only-root-fs
    sdbootutil
    snapper
    transactional-update
    zypper
