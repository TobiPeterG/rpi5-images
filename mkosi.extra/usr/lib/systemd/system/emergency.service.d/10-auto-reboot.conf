[Service]
# There is deliberately no usable root password in these images. Waiting in
# emergency.service would therefore make the machine inaccessible and prevent
# systemd-boot's boot counting from reaching the previous working UKI.
Type=oneshot
ExecStart=
ExecStart=/usr/bin/sleep 10
ExecStart=/usr/bin/systemctl --no-block reboot
StandardInput=null
