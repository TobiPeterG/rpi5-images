[Unit]
RequiresMountsFor=/.state
ConditionDirectoryNotEmpty=
ConditionDirectoryNotEmpty=|/.state/confexts

[Service]
# /var/lib/extensions.mutable is a link into /run
ExecStartPre=+/usr/bin/install -d -m 0700 /run/extensions.mutable
ExecStartPre=+/usr/bin/extkit activate --type confext
Environment=SYSTEMD_CONFEXT_MUTABLE_MODE=yes
