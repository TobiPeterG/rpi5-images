[Content]
# CPIO does not retain SELinux xattrs.
# systemd loads the authenticated real-root policy when switching root.
SELinuxRelabel=no
ExtraTrees=%D/mkosi.initrd.extra
Packages=
    bash
    coreutils
    cryptsetup
    device-mapper
    erofs-utils
    MicroOS-release
    systemd
    udev
    util-linux

RemoveFiles=
    /etc/selinux
    /usr/etc/selinux
    /var/lib/selinux
